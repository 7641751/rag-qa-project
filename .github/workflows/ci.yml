name: CI

# 触发条件：push 到主干 + 所有 PR。
# 路径过滤刻意不加 —— 本仓库只有这一个项目，全量跑约 1 分钟，不值得为省几十秒引入「改了却没过 CI」的盲区。
on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支连推多次时取消旧的运行，避免排队堆积（只取消进行中的旧运行，不影响已完成结果）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（pytest，全离线）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 pyproject.toml 的 requires-python = ">=3.14" 一致
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          # 剔除「本地 HF 嵌入」依赖（sentence-transformers / langchain-huggingface）：
          # 运行时代码从不 import 它们（嵌入走 DashScope 云端），却会拖入 torch
          # （≈ +2GB，CI 上纯属浪费且容易超时）。与 Dockerfile 用同一套策略。
          grep -vE '^(sentence-transformers|langchain-huggingface)' requirements.txt > /tmp/reqs.txt
          pip install -r /tmp/reqs.txt

      - name: 跑测试
        # ⚠ RAGQA_JWT_SECRET 是**必填**：config.py 的 model_validator 在缺少它时直接抛
        # ValueError（HS256 的 HMAC 密钥要 ≥32 字节，RFC 7518 §3.2），会让整个 import 失败
        # —— CI 里没有 .env（已被 .gitignore 忽略），必须在这里注入。
        # 这是本套件唯一需要的环境变量：MySQL / Redis / LLM / 向量库全被 Fake 替身挡掉，
        # 所以 4 个 Redis 在线用例被 pytest.ini 的 addopts 排除、test_redis.py 的连通性自检自动 skip。
        env:
          RAGQA_JWT_SECRET: ${{ secrets.RAGQA_JWT_SECRET || 'ci-only-dummy-secret-0123456789abcdef0123456789abcdef' }}
        run: pytest tests -v

  frontend:
    name: 前端（tsc + vitest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        # 必须用 npm ci（按 lockfile 精确安装）：它能顺带发现 package.json 与
        # package-lock.json 不同步的问题 —— 而这正是 Dockerfile 里 npm ci 会炸的原因。
        run: npm ci

      - name: 类型检查
        # 与测试分开跑：tsc 失败时能一眼看出是类型问题而不是用例失败
        run: npx tsc --noEmit

      - name: 跑测试
        run: npm run test

      - name: 构建产物
        # 只验证能不能构建成功（vite build 的产物不上传 —— 部署走 Docker 多阶段构建）
        run: npx vite build
