openapi: 3.1.0
info:
  title: LangChain 智能问答 API
  version: 0.1.0
  description: >
    CRAG 问答后端契约。核心是 SSE 流式端点 /api/chat/stream；
    事件协议见其 responses.200.description 与 components.schemas 中的 *Event。
servers:
  - url: http://localhost:8000
    description: 本地后端(开发期由 Vite proxy 转发 /api)
tags:
  - name: auth
    description: 账号与鉴权
  - name: chat
    description: 问答与会话
  - name: kb
    description: 知识库文档管理
  - name: system
    description: 系统探针
paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: 注册
      description: >
        成功 201。用户名已存在 → 409 USERNAME_TAKEN（大小写不敏感由 MySQL 的
        utf8mb4_0900_ai_ci 排序规则保证，不是应用层比对）。字段不合法 → 422。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '409': { $ref: '#/components/responses/UsernameTaken' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录
      description: >
        成功 200 + JWT。失败一律 401 INVALID_CREDENTIALS，且**不区分**「用户不存在」与
        「密码错」—— 两者状态码、code、message 逐字相同，避免用户名被枚举。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/auth/me:
    get:
      tags: [auth]
      summary: 当前登录用户
      description: 回显 token 里的用户，用于前端启动时判断本地 token 是否仍有效。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/chat/stream:
    post:
      tags: [chat]
      summary: 提问并流式作答(SSE)
      security:
        - bearerAuth: []
      description: >
        返回 text/event-stream。帧格式 `event: <type>` 换行 `data: <json>` 换行换行。
        事件类型: step/token/sources/done/error。
        成功事件序: 若干 step → 若干 token → sources → done。
        step 中 retrieve/grade_documents/rewrite_query 在节点完成时发(均在 token 前);
        generate 步骤可选地在首个 token 前补发。token.text 仅来自 generate 节点。
        出错: 发 error 后关闭流(不再有 done)。
        需 Bearer token；thread_id 属于他人时在**流开始前**返回 403（响应头尚未发出，
        仍可改状态码）。首次提问会把 thread_id→user_id 归属落库，title 取首问前 20 字。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: SSE 事件流(见上)。各事件 schema 见 components.schemas 的 *Event。
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/KBNotReady' }
  /api/chat/history:
    get:
      tags: [chat]
      summary: 拉取会话历史
      security:
        - bearerAuth: []
      description: >
        需 Bearer token。新/未知 thread_id 返回 200 + 空 messages(不报 404)——
        库里没有归属行即视为新会话放行，只有「已有行且非本人」才 403。
        归属校验先于读 checkpointer，故 403 不受 checkpointer 是否可读影响。
        steps 不入历史。
      parameters:
        - name: thread_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 历史消息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/chat/threads:
    get:
      tags: [chat]
      summary: 列出当前用户的会话(倒序，最多 50 条)
      security:
        - bearerAuth: []
      description: >
        需 Bearer token。只返回本人的会话，按 updated_at 倒序，最多 50 条。
        total 是**真实总数**：total > threads.length 即表示被截断(最多回 50 条)，
        前端据此显示「仅显示最近 50 条」——只回 50 条而不给 total 是看不出被截断的。
        空列表返回 200 + threads:[](新用户进来就是这个状态，不是 404)。
        created_at/updated_at 是带 Z 的 ISO 8601；前端必须按 UTC 解析 ——
        new Date('2026-09-19T06:00:00')(无 Z)按 ECMAScript 规范会被当成**本地时间**，
        相对时间整体偏掉一个时区。
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/chat/threads/{thread_id}:
    patch:
      tags: [chat]
      summary: 重命名会话
      security:
        - bearerAuth: []
      description: >
        需 Bearer token；非本人 → 403，不存在 → 404。
        标题去两端空白后不能为空且不超过 60 字(DB 列宽 varchar(60))，否则 422；
        存的是去空白后的值。
        重命名**不改 updated_at**：它不是一次新活动，不该把会话顶到列表最前。
        403 而非 404 是有意的：thread_id 由前端生成、就写在 URL 里，用户本来就知道
        它存在，403 不构成额外信息泄露；这与「删别人的文档 → 404」相反，
        那个 404 是为了不泄露文档的**存在性**。
      parameters:
        - name: thread_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameRequest' }
      responses:
        '200':
          description: 重命名结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenameResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ThreadNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [chat]
      summary: 删除会话的全部服务端状态(幂等)
      security:
        - bearerAuth: []
      description: >
        需 Bearer token；非本人 → 403，且不产生任何副作用。
        删除该 thread 在 checkpointer 中的全部 checkpoint 与 write 行，
        以及 conversations 里的归属索引行(漏删会让已删会话在 P3 的会话列表里复活)，
        不可恢复。
        幂等: 未知/已删过的 thread_id 返回 200 + deleted=false(不是 404)。
        与 KB 的 DELETE(404) 故意不同: doc_id 来自服务端列表，thread_id 由前端本地生成。
        删除后 GET /api/chat/history 仍返回 200 + 空 messages。
        同一 thread_id 删除后可继续使用(LangGraph 会自动重建)。
      parameters:
        - name: thread_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 删除结果。deleted=false 表示本来就不存在(幂等，非错误)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatDeleteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/health:
    get:
      tags: [system]
      summary: 健康检查
      responses:
        '200':
          description: 服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/kb/documents:
    post:
      tags: [kb]
      summary: 上传文档并入库(SSE 进度)
      security:
        - bearerAuth: []
      description: >
        返回 text/event-stream。帧格式 `event: <type>` 换行 `data: <json>` 换行换行。
        事件类型: progress/done/error。
        成功事件序: progress(saved) → progress(parsed) → progress(split) →
        progress(embedding)×N → done。出错: 发 error 后关闭流(不再有 done)。
        白名单 .md/.txt/.pdf，单文件 ≤ 20MB；不合规在流开始前用 HTTP 4xx 拒绝。
        同名文件视为替换(done.replaced=true)。
        客户端取消(abort)时后端必须按 doc_id 回滚已写入向量。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: .md/.txt/.pdf，≤ 20MB }
      responses:
        '200':
          description: SSE 进度流。事件 schema 见 KbProgressEvent/KbDoneEvent/ErrorEvent。
          content:
            text/event-stream:
              schema: { type: string }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFileType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [kb]
      summary: 列出用户上传的文档
      security:
        - bearerAuth: []
      description: >
        只返回 origin="upload" 的文档，按 uploaded_at 倒序。
        空库返回 200 + 空 documents(不报 404)。
        builtin 为可选摘要，统计不到可整体省略。
      responses:
        '200':
          description: 上传文档列表 + 可选预置摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KbListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/kb/documents/{doc_id}:
    delete:
      tags: [kb]
      summary: 删除上传文档的全部向量块
      security:
        - bearerAuth: []
      description: >
        删除过滤条件必须为 {"$and":[{"doc_id":X},{"origin":"upload"}]}，
        因此预置文档不可删(过滤为空 → 404)。
        幂等: 重复删同一 doc_id 第二次返回 404。
      parameters:
        - name: doc_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KbDeleteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DocNotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        `Authorization: Bearer <access_token>`。token 由 POST /api/auth/login 签发，
        默认 7 天有效（settings.jwt_expire_days）。缺失 / 非 Bearer / 过期 / 被篡改
        一律 401 UNAUTHORIZED，且文案不区分具体原因 —— 对客户端都是「重新登录」。
        本期不实现 refresh token：过期即重新登录。
  schemas:
    ChatRequest:
      type: object
      required: [question, thread_id]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        thread_id: { type: string, format: uuid }
    StepEvent:
      type: object
      required: [node, label]
      properties:
        node: { type: string, enum: [retrieve, grade_documents, rewrite_query, generate] }
        label: { type: string, description: 中文短标签(检索/评分/重写/生成) }
        detail: { type: string, description: 可选摘要(如"召回 8 段") }
    TokenEvent:
      type: object
      required: [text]
      properties: { text: { type: string } }
    Source:
      type: object
      required: [title]
      properties:
        title: { type: string }
        snippet: { type: string }
        score: { type: [number, 'null'] }
    SourcesEvent:
      type: object
      required: [sources]
      properties:
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
    DoneEvent:
      type: object
      required: [thread_id, rewrites, grounded]
      properties:
        thread_id: { type: string, format: uuid }
        rewrites: { type: integer, minimum: 0 }
        grounded:
          type: boolean
          description: >
            true = 本轮答案有知识库依据；false = 未命中知识库、
            答案完全来自模型通用知识，前端必须渲染醒目的未验证标识。
            后端用 bool(final_docs) 确定性得出，不依赖模型自述。
    ErrorEvent:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [VALIDATION_ERROR, RETRIEVAL_ERROR, LLM_ERROR, INTERNAL_ERROR, UNSUPPORTED_FILE_TYPE, FILE_TOO_LARGE, PARSE_ERROR, EMPTY_DOCUMENT, EMBEDDING_ERROR, NOT_FOUND, UNAUTHORIZED, INVALID_CREDENTIALS, FORBIDDEN, USERNAME_TAKEN] }
        message: { type: string }
    HistoryMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
        grounded:
          type: [boolean, 'null']
          description: >
            仅 assistant 消息有意义。false = 该回答无知识库依据，刷新后仍应渲染警示标识。
            需后端把它写进 AIMessage.additional_kwargs["grounded"] 才会返回；未持久化时为 null。
    HistoryResponse:
      type: object
      required: [thread_id, messages]
      properties:
        thread_id: { type: string, format: uuid }
        messages: { type: array, items: { $ref: '#/components/schemas/HistoryMessage' } }
    ChatDeleteResponse:
      type: object
      required: [thread_id, deleted]
      properties:
        thread_id: { type: string, format: uuid }
        deleted:
          type: boolean
          description: >
            删除前该 thread 是否存在至少一个 checkpoint。false = 本来就不存在(幂等，非错误)。
            adelete_thread 返回 None，拿不到是否真删了，后端需先探测存在性：
            checkpointer.alist(config, limit=1) 轻量判断即可（AsyncSqliteSaver 异步接口，
            其同步桥接方法在事件循环线程上调用会抛 InvalidStateError）。
    ConversationSummary:
      type: object
      required: [thread_id, title, created_at, updated_at]
      properties:
        thread_id: { type: string, format: uuid }
        title:
          type: string
          description: >
            首问前 20 字，之后可由用户手动重命名(PATCH)。上限 60 字(DB 列宽 varchar(60))。
        created_at:
          type: string
          format: date-time
          description: 带 Z 的 ISO 8601(UTC)。前端必须按 UTC 解析，否则相对时间偏一个时区。
        updated_at:
          type: string
          format: date-time
          description: 最后一次提问时间(重命名不改它)。列表按它倒序。
    ThreadListResponse:
      type: object
      required: [threads, total]
      properties:
        threads:
          type: array
          items: { $ref: '#/components/schemas/ConversationSummary' }
        total:
          type: integer
          description: >
            本人会话的**真实总数**。threads 最多 50 条，total 更大即表示被截断 ——
            前端据此显示「仅显示最近 50 条」。只回 50 条而不给 total 是看不出截断的。
    RenameRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
          description: 新标题。去两端空白后不能为空，否则 422。
    RenameResponse:
      type: object
      required: [thread_id, title]
      properties:
        thread_id: { type: string, format: uuid }
        title: { type: string, description: 实际落库的标题(已去两端空白) }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
        kb_count: { type: integer }
        model: { type: string }
    KbProgressEvent:
      type: object
      required: [stage]
      properties:
        stage: { type: string, enum: [saved, parsed, split, embedding] }
        current: { type: [integer, 'null'], description: embedding 阶段必填(已嵌入段数) }
        total: { type: [integer, 'null'], description: embedding 阶段必填(总段数) }
        message: { type: string, description: 可读中文短句，前端直接显示 }
    KbDoneEvent:
      type: object
      required: [doc_id, filename, chunks, replaced, uploaded_at]
      properties:
        doc_id: { type: string, format: uuid }
        filename: { type: string }
        chunks: { type: integer, minimum: 1 }
        replaced: { type: boolean, description: true 表示同名旧文档已被替换 }
        uploaded_at: { type: string, format: date-time }
    KbDocument:
      type: object
      required: [doc_id, filename, chunks, uploaded_at]
      properties:
        doc_id: { type: string, format: uuid }
        filename: { type: string }
        title: { type: string }
        chunks: { type: integer, minimum: 0 }
        size_bytes: { type: integer }
        uploaded_at: { type: string, format: date-time }
    KbBuiltinSummary:
      type: object
      required: [docs, chunks]
      properties:
        docs: { type: integer }
        chunks: { type: integer }
    KbListResponse:
      type: object
      required: [documents]
      properties:
        documents: { type: array, items: { $ref: '#/components/schemas/KbDocument' } }
        builtin: { $ref: '#/components/schemas/KbBuiltinSummary' }
    KbDeleteResponse:
      type: object
      required: [doc_id, filename, deleted_chunks]
      properties:
        doc_id: { type: string, format: uuid }
        filename: { type: string }
        deleted_chunks: { type: integer, minimum: 0 }
    AuthUser:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, description: 用户主键 }
        username: { type: string }
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
          description: 3–32 位，仅字母 / 数字 / 下划线
        password:
          type: string
          minLength: 8
          description: >
            至少 8 位，且 **UTF-8 编码后 ≤ 72 字节**：bcrypt 的硬上限，超出返回 422。
            注意单位是**字节不是字符** —— 30 个汉字就有 90 字节，会被拒。
            两层都做这个检查且都要保留：schema 层（@field_validator）负责让 422 定位到
            password 字段；security.hash_password 那层则覆盖改密码等不经过本模型的路径。
    LoginRequest:
      type: object
      required: [username, password]
      description: >
        字段约束与 RegisterRequest **完全相同**（后端复用同一个 pydantic 模型 Auth）。
        但凭证校验失败时，响应必须与「用户名不存在」无法区分：无论哪种原因都是
        401 INVALID_CREDENTIALS 且 message 逐字相同，避免用户名被枚举。
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
        password:
          type: string
          minLength: 8
          description: UTF-8 编码后 ≤ 72 字节（与 RegisterRequest 同一套约束）
    LoginResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: { type: string, description: JWT }
        token_type: { type: string, enum: [bearer] }
        user: { $ref: '#/components/schemas/AuthUser' }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    ValidationError:
      description: 请求体校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    KBNotReady:
      description: 知识库未就绪
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    UnsupportedFileType:
      description: 扩展名不在白名单(.md/.txt/.pdf)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    FileTooLarge:
      description: 文件超过 20MB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    DocNotFound:
      description: >
        doc_id 不存在、指向不可删的预置文档，或属于其他用户。
        三种情况都是**过滤命中 0 条** → 同一个 404，刻意不用 403：
        403 会泄露「该 doc_id 存在但不属于你」，而 404 与「这个 id 根本不存在」不可区分。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    ThreadNotFound:
      description: >
        thread_id 在 conversations 表里没有归属行（code=NOT_FOUND）。
        注意与 Forbidden 的分工：有行但非本人 → 403；无行且调用方要求「必须已存在」
        （如 PATCH 重命名）→ 404。而 GET /api/chat/history 对无行是**放行**返回空列表。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: 缺少 / 非 Bearer / 过期 / 被篡改的 token（code=UNAUTHORIZED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: >
        已登录，但目标 thread_id 不属于当前用户（code=FORBIDDEN）。
        适用于 chat 的 history / stream / threads 删除 / threads 重命名。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    InvalidCredentials:
      description: >
        用户名或密码错（code=INVALID_CREDENTIALS）。**故意不区分**这两种情况，
        文案逐字相同，避免用户名枚举。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    UsernameTaken:
      description: 注册时用户名已存在（code=USERNAME_TAKEN）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
