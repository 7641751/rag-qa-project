# 静态资源 + 反向代理：浏览器只访问 :8080，前端发相对路径 /api/*，由 nginx 转发到后端容器（无 CORS 问题）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传限制：后端允许单文件 ≤20MB（README「限额」），留余量
    client_max_body_size 25m;

    # SPA 路由：非文件请求一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠ 两个 SSE 流式端点必须关缓冲：否则 nginx 会攒满缓冲再发，「逐 token 吐字」退化成一次性返回。
    #   proxy_read_timeout 放宽到 10 分钟：LLM 生成 + 多轮改写可能远超默认 60s。
    location /api/chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/kb/documents {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # 上传进度同样是 SSE
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其余 API 普通反代
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 交互式文档也顺手反代，方便在 :8080 上调试
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
