[pytest]
# 默认套件保持「全部离线、零外部依赖」（这条基线写在 tests/test_graph.py 的开头），
# 所以需要真实服务的用例必须显式排除，而不是靠 skip —— skip 会让「配了却连不上」
# 这种最该告警的状态悄悄变绿。
#
# tests/test_redis.py 分两层：格式层永远跑（不需要服务）；连接层是 online 用例，
# 打上 redis 标记、默认不跑。需要自检时：
#     python -m pytest -m redis -v
addopts = -m "not redis"

markers =
    redis: 需要真实 Redis 服务的连通性自检（默认不跑，用 -m redis 启用）
